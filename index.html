<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<meta name="description" content="Calcula cuánto dinero adicional y cuántos días libres generas durante la recarga.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recarga">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Recarga Control</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;--bg:#f7f8fa;--panel:#fff;--ink:#1b2633;--muted:#667483;--line:#e5eaf0;--field:#f4f6f8;--accent:#2f69aa;--green:#176746}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #94bdf1;outline-offset:2px}
main{max-width:610px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(48px + env(safe-area-inset-bottom,0px))}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:39px;height:39px;display:grid;place-items:center;background:#e6effb;color:var(--accent);border-radius:11px;font-weight:900;font-size:20px}
.brandname{font-weight:780;letter-spacing:-.025em;font-size:19px}.subbrand{font-size:11px;color:var(--muted);margin-top:1px}
.convenio-actions{display:flex;flex-wrap:wrap;gap:9px;margin:-6px 0 19px}.convenio-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #ceddee;border-radius:10px;background:#edf4fc;color:#285c92;font-size:13px;font-weight:700;text-decoration:none;padding:10px 13px;margin:0;min-height:40px}
button.gear{background:white;border:1px solid var(--line);padding:10px 13px;border-radius:12px;font-size:18px;color:var(--ink)}
h1{font-size:26px;line-height:1.16;letter-spacing:-.045em;margin:0 0 9px}h2{font-size:16px;letter-spacing:-.015em;margin:0 0 17px}h3{font-size:14px;margin:0}
.lead{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 24px}
.panel{border:1px solid var(--line);background:var(--panel);padding:20px;border-radius:17px;margin:14px 0}
label.field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#455567;font-weight:600}
label.field input{appearance:none;border:1px solid #dce3ec;background:var(--field);padding:13px 12px;height:48px;border-radius:10px;width:100%;min-width:0;color:var(--ink);font-size:16px;font-weight:600}
label.field input::placeholder{font-weight:400;color:#8b98a5}
label.field input:disabled{background:#eef0f3}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 12px}.grid .full{grid-column:1/-1}
.sep{height:1px;background:var(--line);margin:20px 0}.small{font-size:12px;color:var(--muted);line-height:1.55}.note{background:#f2f6fb;border:1px solid #e2eaf5;border-radius:11px;padding:13px;color:#415b78;font-size:12px;line-height:1.5;margin-top:16px}
.primary{display:block;width:100%;border:0;background:var(--accent);color:white;font-weight:730;border-radius:12px;padding:14px 18px;min-height:49px;margin-top:18px}
.secondary{border:1px solid #cad6e3;background:white;color:var(--accent);padding:11px 14px;border-radius:10px;font-weight:670}
.danger{color:#a23d35}
.error{background:#fff1ef;color:#b13e35;padding:10px;border:1px solid #f1cdc8;border-radius:10px;font-size:12px;line-height:1.5;margin-top:12px}
.checkline{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:570}
.checkline:last-of-type{border-bottom:0}
.checkline input{appearance:none;width:22px;height:22px;flex:0 0 22px;border:1.8px solid #aab8c9;border-radius:6px;background:#fff;position:relative;margin:0;cursor:pointer}
.checkline input:checked{background:var(--accent);border-color:var(--accent)}
.checkline input:checked:after{content:"✓";position:absolute;left:4px;top:-3px;color:#fff;font-size:19px;font-weight:800}
.checkline .checktext{flex:1}
.reveal{background:#f6f8fb;border-radius:12px;padding:14px;margin:3px 0 10px}
.reveal .grid{gap:12px}.statusline{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-top:12px}.statusline b{color:var(--ink);font-size:13px}
.totals{padding:19px;margin-top:18px}
.totalrow{padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.totalrow:last-child{border:0}.totalrow strong{font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.totalrow span{font-size:13px;color:#516274;line-height:1.35}
.totalrow.large{padding:18px 0}.totalrow.large strong{font-size:26px;color:var(--green)}
.explain{background:#f3f6fa;border-radius:10px;padding:12px 13px;color:#586776;font-size:12px;line-height:1.5;margin-top:13px}
.irpf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.irpf label{font-size:13px;font-weight:650}.irpf input{width:89px;text-align:right;border:1px solid #cfdbe7;background:var(--field);border-radius:9px;font-size:16px;font-weight:700;padding:10px 12px}
.inlinerow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:11px 0;font-size:13px}.inlinerow .value{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
details{border:1px solid var(--line);border-radius:12px;background:white;margin-top:13px;overflow:hidden}
summary{padding:15px 17px;cursor:pointer;font-size:13px;font-weight:700}
.detailbody{padding:0 17px 15px}
.detailrow{display:flex;justify-content:space-between;gap:12px;margin:11px 0;font-size:12px}
.detailrow span:first-child{color:var(--muted)}
.detailrow span:last-child{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:#84919e;line-height:1.6;text-align:center;margin:22px 4px 0}
.modalback{position:fixed;inset:0;background:#13233b91;display:grid;place-items:center;padding:18px;z-index:9}
.modal{max-width:420px;width:100%;background:white;border-radius:19px;padding:25px;box-shadow:0 20px 70px #14223d45}
.modal h2{font-size:21px}.modal p{color:var(--muted);font-size:14px;line-height:1.5}
.modal .actions{display:flex;gap:10px}.modal .actions button{flex:1}
button.ghost{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff;color:var(--ink);font-weight:680}
@media(max-width:350px){main{padding-left:12px;padding-right:12px}.panel{padding:15px}.totalrow strong{font-size:17px}.totalrow.large strong{font-size:23px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
(() => {
"use strict";
const KEY="recarga-control-simple-v3";
const DEFAULT={name:"",normalRate:"",extraRate:"",dietRate:"19.50",kmRate:"0.47",premiumRate:"625.46",weekRate:"300",irpf:"23"};
const EMPTY={normal:"",extra:"",diets:"",km:"",comp:false,compHours:"",premium:false,week:false,other:false,otherAmount:""};
let state={configured:false,prices:{...DEFAULT},values:{...EMPTY}},screen="start",modal="";
try{
 const prior=JSON.parse(localStorage.getItem(KEY)||"null");
 if(prior&&typeof prior==="object"){
  state.configured=prior.configured===true;
  state.prices={...DEFAULT,...(prior.prices||{})};
  state.values={...EMPTY,...(prior.values||{})};
 }
}catch(e){}
if(state.configured) screen="calc";
const app=document.getElementById("app");
const parse=v=>{let n=Number(String(v==null?"":v).trim().replace(",","."));return Number.isFinite(n)?Math.max(0,Math.min(n,1e9)):0};
const curr=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Math.round((n+Number.EPSILON)*100)/100);
const fmt=n=>new Intl.NumberFormat("es-ES",{maximumFractionDigits:3}).format(n);
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function cash(){
 const p=state.prices,v=state.values;
 const hNormal=parse(v.normal),hExtra=parse(v.extra),requested=v.comp?parse(v.compHours):0;
 const valid=requested<=hExtra,restH=Math.min(requested,hExtra),paidH=hExtra-restH;
 const hourlyNormal=hNormal*parse(p.normalRate);
 const paidExtra=paidH*parse(p.extraRate)*1.5;
 const compPremium=restH*parse(p.extraRate)*.5;
 const travel=parse(v.diets)*parse(p.dietRate)+parse(v.km)*parse(p.kmRate);
 const paidPrime=v.premium?Math.max(0,parse(p.premiumRate)-(v.week?parse(p.weekRate):0)):0;
 const other=v.other?parse(v.otherAmount):0;
 const extraGross=paidExtra+compPremium+travel+paidPrime+other;
 const totalGross=hourlyNormal+extraGross;
 const taxable=paidExtra+compPremium+paidPrime+other;
 const irpf=taxable*parse(p.irpf)/100;
 const ssExtra=paidExtra*.047;
 const ssCommon=(compPremium+paidPrime+other)*.065;
 const ss=ssExtra+ssCommon;
 const extraNet=extraGross-irpf-ss;
 return {hNormal,hExtra,requested,valid,restH,paidH,hourlyNormal,paidExtra,compPremium,travel,paidPrime,other,extraGross,totalGross,taxable,irpf,ssExtra,ssCommon,ss,extraNet,days:restH*1.75/8+(v.week&&v.premium?5:0),compDays:restH*1.75/8};
}
function field(label,key,value,target,opts={}){
 const type=opts.text?"text":"number",placeholder=opts.placeholder||"0",step=type==="number"?'step="any" min="0" inputmode="decimal"':"",required=opts.required?' aria-required="true"':"";
 return '<label class="field '+(opts.full?"full":"")+'"><span>'+label+'</span><input type="'+type+'" '+step+required+' data-'+target+'="'+key+'" value="'+escapeHTML(value)+'" placeholder="'+escapeHTML(placeholder)+'" autocomplete="off"></label>';
}
function header(settings){
return '<div class="header"><div class="brand"><div class="logo">R</div><div><div class="brandname">Recarga Control</div><div class="subbrand">Tu calculadora de recarga</div></div></div>'+ (settings?'<button class="gear" type="button" data-action="back" aria-label="Volver a la calculadora">←</button>':'<button class="gear" type="button" data-action="settings" aria-label="Cambiar precios">⚙</button>')+'</div>';
}
function configScreen(){
const p=state.prices,settings=state.configured;
return (settings?header(true):'<div class="header"><div class="brand"><div class="logo">R</div><div><div class="brandname">Recarga Control</div><div class="subbrand">Configuración inicial</div></div></div></div>')+
'<h1>'+(settings?'Modificar precios':'Configura tus precios')+'</h1><p class="lead">Guarda tus tarifas una sola vez. Las podrás modificar en cualquier momento.</p>'+
'<div class="convenio-actions"><a class="convenio-link" href="https://www.ccoo.cat/industria/conveni-de-la-industria-siderometallurgica-de-tarragona/" target="_blank" rel="noopener noreferrer">▤ &nbsp;Ver convenio TGN</a><a class="convenio-link" href="./convenio-acsa.html" target="_blank" rel="noopener">▤ &nbsp;Ver convenio ACSA</a></div>'+

'<section class="panel"><div class="grid">'+field('Nombre (opcional)','name',p.name,'price',{full:true,text:true,placeholder:'Tu nombre'})+
field('Hora normal (€/h)','normalRate',p.normalRate,'price',{required:true,placeholder:'Obligatorio'})+
field('Hora extra (€/h)','extraRate',p.extraRate,'price',{required:true,placeholder:'Obligatorio'})+
'</div><div class="sep"></div><h2>Precios precargados, editables</h2><div class="grid">'+
field('Media dieta (€)','dietRate',p.dietRate,'price')+
field('Kilometraje (€/km)','kmRate',p.kmRate,'price')+
field('Prima de recarga (€)','premiumRate',p.premiumRate,'price')+
field('Compra de 5 días (€)','weekRate',p.weekRate,'price')+
field('IRPF (%) · editable','irpf',p.irpf,'price')+
'</div><div class="note">Retén y salario habitual no se calculan como dinero extra. La prima corresponde a la referencia ACS 2026; los valores de media dieta y kilometraje son referencias anteriores pendientes de confirmar con las tablas provinciales definitivas de 2026.</div>'+
'<div class="sep"></div><div class="small">Coeficientes: horas extras cobradas ×1,50 · descanso de horas compensadas ×1,75 · prima por compensar ×0,50.</div>'+
'<button class="primary" type="button" data-action="prepare">Aceptar y continuar</button><div id="validation"></div></section>'+
'<p class="foot">Tu información se guarda en este móvil, sin cuentas ni registro.</p>';
}
function check(label,key,checked){
return '<label class="checkline"><span class="checktext">'+label+'</span><input type="checkbox" data-flag="'+key+'" '+(checked?'checked':'')+'></label>';
}
function calculator(){
const v=state.values,p=state.prices,c=cash();
return header(false)+'<h1>'+(p.name?'Recarga de '+escapeHTML(p.name):'Calculadora de recarga')+'</h1>'+
'<p class="lead">Introduce los totales de toda la recarga, aunque dure varios meses. No necesitas apuntar los datos día a día.</p>'+
'<div class="convenio-actions"><a class="convenio-link" href="https://www.ccoo.cat/industria/conveni-de-la-industria-siderometallurgica-de-tarragona/" target="_blank" rel="noopener noreferrer">▤ &nbsp;Ver convenio TGN</a><a class="convenio-link" href="./convenio-acsa.html" target="_blank" rel="noopener">▤ &nbsp;Ver convenio ACSA</a></div>'+

'<section class="panel"><h2>Horas y desplazamientos</h2><div class="grid">'+
field('Horas normales','normal',v.normal,'val')+field('Horas extras','extra',v.extra,'val')+
field('Medias dietas','diets',v.diets,'val')+field('Kilómetros','km',v.km,'val')+
'</div></section>'+
'<section class="panel"><h2>Complementos y descansos</h2>'+
check('He compensado horas extras','comp',v.comp)+
(v.comp?'<div class="reveal">'+field('Horas extras que compensas','compHours',v.compHours,'val',{placeholder:'Ej. 11'})+
'<div class="statusline"><span>Descanso conseguido</span><b id="compDays">'+fmt(c.compDays)+' días</b></div>'+
'<div class="statusline"><span>Prima por compensación</span><b id="compCash">'+curr(c.compPremium)+'</b></div>'+
'<div id="hoursWarn">'+(!c.valid?'<div class="error">Has compensado más horas de las extras indicadas. El cálculo usa únicamente las horas disponibles.</div>':'')+'</div></div>':'')+
check('Cobro la prima de recarga','premium',v.premium)+
check('He comprado 5 días de descanso','week',v.week)+
(v.week?'<div class="reveal"><div class="statusline"><span>Días libres adicionales</span><b>5 días</b></div><div class="statusline"><span>Descuento de la prima</span><b>−'+curr(parse(p.weekRate))+'</b></div>'+(v.premium?'':'<div class="error">Para comprar los cinco días debe estar activada la prima de recarga.</div>')+'</div>':'')+
check('Tengo algún plus adicional','other',v.other)+
(v.other?'<div class="reveal">'+field('Importe bruto adicional (€)','otherAmount',v.otherAmount,'val')+'</div>':'')+
'</section>'+
'<section class="panel totals" id="results"></section>'+
'<details id="detail"><summary>Ver desglose completo</summary><div class="detailbody" id="details"></div></details>'+
'<p class="foot">Estimación orientativa de la recarga, no una nómina oficial. No incluye retén ni seguro médico. Se guarda automáticamente.</p>';
}
function detailed(c){
return [
['Horas normales (solo valor total)',c.hourlyNormal],
['Horas extras cobradas (×1,5)',c.paidExtra],
['Prima de horas compensadas (×0,5)',c.compPremium],
['Dietas y kilometraje',c.travel],
['Prima recarga, descontada compra',c.paidPrime],
['Otros complementos',c.other],
['Valor total generado',c.totalGross],
['Dinero extra bruto',c.extraGross],
['IRPF estimado sobre lo sujeto a retención',-c.irpf],
['Cotización adicional extras (4,70 %)',-c.ssExtra],
['Cotización ordinaria de otros pluses (6,50 %)',-c.ssCommon],
['Dinero extra neto estimado',c.extraNet]
].map(([n,v])=>'<div class="detailrow"><span>'+n+'</span><span>'+curr(v)+'</span></div>').join('')+
'<div class="note">Las horas normales se muestran únicamente en el valor total: ya se abonan en las nóminas habituales. Las dietas y el kilometraje se consideran exentos en esta simulación si cumplen los requisitos legales; de otro modo el neto real será menor. La cotización exacta también depende de la distribución entre nóminas y sus bases.</div>';
}
function resultHTML(c){
return '<h2>Resultado de la recarga</h2>'+
'<div class="totalrow"><span>Valor total generado (bruto)</span><strong>'+curr(c.totalGross)+'</strong></div>'+
'<div class="totalrow"><span>Dinero extra generado (bruto)</span><strong>'+curr(c.extraGross)+'</strong></div>'+
'<div class="explain">Las horas normales no se incluyen en el dinero extra porque ya se cobran en las nóminas habituales. Sumarlas otra vez duplicaría ese ingreso.</div>'+
'<div class="irpf"><label for="editable-irpf">IRPF (%) · editable siempre</label><input id="editable-irpf" type="number" inputmode="decimal" step="any" min="0" max="100" data-price="irpf" value="'+escapeHTML(state.prices.irpf)+'"></div>'+
'<div class="inlinerow"><span>IRPF estimado</span><span class="value">−'+curr(c.irpf)+'</span></div>'+
'<div class="inlinerow"><span>Seguridad Social estimada</span><span class="value">−'+curr(c.ss)+'</span></div>'+
'<div class="totalrow large"><span><b>Dinero extra neto estimado</b></span><strong>'+curr(c.extraNet)+'</strong></div>'+
'<div class="totalrow"><span>Días libres conseguidos</span><strong>'+fmt(c.days)+' días</strong></div>'+
'<p class="small">Se aplica un 4,70 % a las horas extras cobradas y una estimación del 6,50 % a las primas y otros pluses sujetos a cotización. Dietas y km se consideran exentos solo si cumplen los requisitos legales.</p>';
}
function refresh(){
if(screen!=="calc")return;
const c=cash(),r=document.getElementById("results"),detail=document.getElementById("details");
if(!r)return;
const irpf=document.getElementById("editable-irpf");
const focused=document.activeElement===irpf;
const cursor=focused?irpf.selectionStart:null;
r.innerHTML=resultHTML(c);
if(detail)detail.innerHTML=detailed(c);
let cd=document.getElementById("compDays");if(cd)cd.textContent=fmt(c.compDays)+" días";
let cp=document.getElementById("compCash");if(cp)cp.textContent=curr(c.compPremium);
let warn=document.getElementById("hoursWarn");if(warn)warn.innerHTML=c.valid?'':'<div class="error">Has compensado más horas de las extras indicadas. El cálculo usa únicamente las horas disponibles.</div>';
if(focused){const n=document.getElementById("editable-irpf");n.focus();try{n.setSelectionRange(cursor,cursor)}catch(e){}}
}
function render(){
app.innerHTML=(screen==="calc"&&state.configured)?calculator():configScreen();
if(screen==="calc"&&state.configured)refresh();
}
function modalHTML(){
return '<div class="modalback" id="modalback"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">Revisa bien tus precios</h2>'+
'<p>Comprueba el precio de la hora normal, de la hora extra y los importes precargados antes de calcular. Si alguno está mal, el resultado también lo estará.</p>'+
'<div class="actions"><button class="ghost" type="button" data-action="cancelModal">Revisar</button><button class="primary" style="margin-top:0" type="button" data-action="confirmPrices">Son correctos</button></div></div></div>';
}
function validate(){
const p=state.prices;
if(parse(p.normalRate)<=0||parse(p.extraRate)<=0)return "Introduce un precio válido, mayor que cero, para la hora normal y la hora extra.";
if(parse(p.irpf)>100)return "El IRPF no puede superar el 100 %.";
return "";
}
app.addEventListener("input",ev=>{
const el=ev.target;
if(el.dataset.price){
 const key=el.dataset.price;state.prices[key]=el.value;
 if(key==="irpf"&&parse(el.value)>100)el.setCustomValidity("No puede superar el 100 %");else el.setCustomValidity("");
 save();
 if(screen==="calc") {
  // Keep IRPF control focused without recreating it during edits.
  const c=cash(),blocks=document.getElementById("results");
  if(blocks){
   const all=blocks.querySelectorAll(".inlinerow .value");
   if(all[0])all[0].textContent="−"+curr(c.irpf);
   if(all[1])all[1].textContent="−"+curr(c.ss);
   const big=blocks.querySelector(".totalrow.large strong");if(big)big.textContent=curr(c.extraNet);
   const detail=document.getElementById("details");if(detail)detail.innerHTML=detailed(c);
  }
 }
 return;
}
if(el.dataset.val){state.values[el.dataset.val]=el.value;save();refresh()}
});
app.addEventListener("change",ev=>{
const el=ev.target;
if(el.dataset.flag){
 const flag=el.dataset.flag;
 state.values[flag]=el.checked;
 if(flag==="premium"&&!el.checked)state.values.week=false;
 if(flag==="week"&&el.checked&&!state.values.premium){state.values.week=false;alert("Para comprar los cinco días marca primero la prima de recarga.");}
 save();render();
}
});
document.addEventListener("click",ev=>{
const button=ev.target.closest("[data-action]");if(!button)return;
switch(button.dataset.action){
case "settings":screen="settings";render();scrollTo(0,0);break;
case "back":screen="calc";render();scrollTo(0,0);break;
case "prepare":{
 const err=validate();
 const box=document.getElementById("validation");
 if(err){if(box)box.innerHTML='<div class="error">'+err+'</div>';break;}
 if(box)box.innerHTML="";
 modal="prices";document.body.insertAdjacentHTML("beforeend",modalHTML());break;
}
case "cancelModal":document.getElementById("modalback")?.remove();modal="";break;
case "confirmPrices":
 document.getElementById("modalback")?.remove();modal="";
 state.configured=true;screen="calc";save();render();scrollTo(0,0);
 break;
}
});
render();
if("serviceWorker" in navigator && location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
