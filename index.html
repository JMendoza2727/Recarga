<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101925"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Recarga">
<meta name="description" content="Registro de horas y estimación de nómina de recarga.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg">
<title>Recarga · Control de nómina</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#101925;--surface:#172435;--line:#2a3a4d;--txt:#f1f6fc;--muted:#9aacbf;--blue:#60a5fa;--green:#6ee7b7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}button{cursor:pointer}header{background:#142033;border-bottom:1px solid var(--line);padding:18px max(17px,calc((100vw - 760px)/2));display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px;letter-spacing:.03em}header small{color:var(--muted)}main{max-width:760px;margin:auto;padding:18px 16px 70px}.pill{border-radius:100px;background:#203247;color:#c3d4ea;padding:6px 10px;font-size:11px}.month{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:18px 0}h1{font-size:25px;margin:0;text-transform:capitalize;letter-spacing:-.02em}h2{font-size:18px;margin:6px 0 16px}h3{font-size:15px;margin:0 0 10px}.sub{color:var(--muted);font-size:12px}.navbtn{border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--txt);padding:9px 15px;font-weight:800}.tabs{display:flex;gap:5px;background:#172334;border:1px solid var(--line);border-radius:13px;padding:5px;margin:0 0 16px}.tabs button{flex:1;background:none;color:var(--muted);border:0;border-radius:10px;padding:11px 4px;font-size:13px}.tabs button.active{background:#2b4665;color:#fff;font-weight:700}.card{border:1px solid var(--line);border-radius:17px;background:var(--surface);padding:17px;margin:12px 0}.hero{background:linear-gradient(135deg,#1e3b60,#172637);border:1px solid #345479}.hero .amount{font-size:39px;font-weight:800;letter-spacing:-.05em;margin:6px 0}.hero .amount span{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#192c3f;border-radius:11px;padding:14px}.metric b{display:block;font-size:19px;margin-top:5px}.metric span{font-size:11px;color:#acc0d4}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.line:last-child{border-bottom:0}.line strong{font-variant-numeric:tabular-nums}.hint{color:var(--muted);line-height:1.55;font-size:12px}label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#bcd0e2}input,select{display:block;width:100%;padding:11px 10px;background:#111d2c;border:1px solid #36516a;border-radius:9px;color:#fff;min-width:0}input:focus,select:focus{outline:2px solid #407fbf}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}.wide{grid-column:span 2}.switch{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:14px}.switch input{width:18px;height:18px;accent-color:#57a7ee}.btn{background:#356da7;border:1px solid #467db5;border-radius:10px;padding:11px 15px;color:#fff;font-weight:700}.btn.ghost{background:#1b2e43;border-color:#344c64}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dayrow{border-top:1px solid var(--line);padding:13px 0}.dayhead{display:flex;justify-content:space-between;gap:9px;align-items:center;margin:0 0 10px;font-weight:700}.dayhead .sun{color:#f4c87f}.daygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.daygrid label{font-size:11px}.daygrid input{padding:9px 7px;text-align:center}.totals{position:sticky;bottom:0;border:1px solid #335b80;background:#1a3752;box-shadow:0 -8px 24px #101925c9;border-radius:13px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:3}.totals b{font-size:22px}footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;padding:20px 0}@media(min-width:600px){.daygrid{grid-template-columns:repeat(6,minmax(0,1fr))}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:380px){.daygrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .amount{font-size:32px}}
</style></head><body>
<header><strong>▤ RECARGA</strong><small>Control de nómina <span class="pill">Privado · Offline</span></small></header>
<main><div class="month"><button class="navbtn" id="prev" aria-label="Mes anterior">‹</button><div style="text-align:center"><div class="sub">PERIODO</div><h1 id="month"></h1></div><button class="navbtn" id="next" aria-label="Mes siguiente">›</button></div>
<div class="tabs"><button data-tab="resumen" class="active">Resumen</button><button data-tab="registro">Registro</button><button data-tab="ajustes">Tarifas y ajustes</button></div><div id="view"></div>
<footer>Estimación orientativa. Los importes pueden diferir de la nómina oficial. Los datos se guardan únicamente en este dispositivo.</footer></main>
<script>
(function(){
"use strict";
var KEY="recarga-control-2026-v1", S={
name:"",mode:"daily",normalRate:18.05,extraRate:18.05,dailyBase:62.14,dailyPTP:9.58,dailyNuclear:6.61,dailyTurn:3.53,showPTP:true,showNuclear:true,showTurn:true,fixedPay:2455.8,
extraFactor:1.5,restFactor:1.75,restCashFactor:.5,hoursPerDay:8,
kmRate:0,dietRate:0,dayPlusRate:0,holidayPlusRate:0,
onCallNormalRate:28.60,onCallHolidayRate:71.51,premiumRate:625.46,weekCost:300,
irpf:23.17,socialRate:6.5,extraContribution:385.63,collectiveContribution:3.87,
healthFlexible:41.67,healthInKind:22.17
};
var d;try{d=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){d={}}if(!d||typeof d!=="object")d={};
d.settings=Object.assign({},S,d.settings||{});d.months=d.months||{};
var today=new Date(), month=d.currentMonth||[today.getFullYear(),String(today.getMonth()+1).padStart(2,"0")].join("-"),tab="resumen";
function num(v){var n=Number(String(v===undefined||v===null?"":v).replace(",","."));return isFinite(n)?n:0}
function non(v){return Math.max(0,num(v))}
function r(v){return Math.round((v+Number.EPSILON)*100)/100}
function money(v){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(v)}
function save(){d.currentMonth=month;localStorage.setItem(KEY,JSON.stringify(d))}
function md(){if(!d.months[month])d.months[month]={days:{},compDays:0,onCall:false,onNormal:0,onHoliday:0,premium:false,buyWeek:false,otherGross:0,otherDed:0};return d.months[month]}
function monthDays(){var parts=month.split("-").map(Number);return new Date(parts[0],parts[1],0).getDate()}
function calc(){
 var s=d.settings,m=md(),days=Object.values(m.days||{}),sum=function(k){return days.reduce(function(a,b){return a+non(b[k])},0)};
 var normal=sum("normal"),extra=sum("extra"),km=sum("km"),diets=sum("diet"),pd=sum("pd"),pf=sum("pf");
 var req=non(m.compDays),compH=Math.min(extra,req*non(s.hoursPerDay)/Math.max(.01,non(s.restFactor))),compDays=compH*non(s.restFactor)/Math.max(.01,non(s.hoursPerDay));
 var paidH=Math.max(0,extra-compH),cashExtra=r(paidH*non(s.extraRate)*non(s.extraFactor)),restCash=r(compH*non(s.extraRate)*non(s.restCashFactor));
 var base=s.mode==="hourly"?r((normal+compDays*non(s.hoursPerDay))*non(s.normalRate)):
 s.mode==="fixed"?r(non(s.fixedPay)):
 r(monthDays()*(non(s.dailyBase)+(s.showPTP?non(s.dailyPTP):0)+(s.showNuclear?non(s.dailyNuclear):0)+(s.showTurn?non(s.dailyTurn):0)));
 var onCall=m.onCall?r(non(m.onNormal)*non(s.onCallNormalRate)+non(m.onHoliday)*non(s.onCallHolidayRate)):0;
 var supplements=r(km*non(s.kmRate)+diets*non(s.dietRate)+pd*non(s.dayPlusRate)+pf*non(s.holidayPlusRate));
 var premium=m.premium?r(Math.max(0,non(s.premiumRate)-(m.buyWeek?non(s.weekCost):0))):0;
 var gross=r(base+cashExtra+restCash+onCall+supplements+premium+num(m.otherGross));
 var ssBase=non(gross+non(s.extraContribution)+non(s.collectiveContribution));
 var ss=r(r(ssBase*.0485)+r(ssBase*.0155)+r(ssBase*.001));if(non(s.socialRate)!==6.5)ss=r(ssBase*non(s.socialRate)/100);
 var flexible=m.health?non(s.healthFlexible):0,inkind=m.health?non(s.healthInKind):0;
 var taxable=Math.max(0,gross-flexible-inkind),irpf=r(taxable*non(s.irpf)/100),inkindIRPF=r(inkind*non(s.irpf)/100);
 var deductions=r(ss+irpf+inkindIRPF+flexible+inkind+num(m.otherDed)),net=r(gross-deductions);
 return {normal:normal,extra:extra,compH:compH,compDays:compDays,possibleDays:extra*non(s.restFactor)/Math.max(.01,non(s.hoursPerDay)),paidH:paidH,cashExtra:cashExtra,restCash:restCash,base:base,onCall:onCall,supplements:supplements,premium:premium,gross:gross,ss:ss,irpf:irpf,flexible:flexible,inkind:inkind,inkindIRPF:inkindIRPF,deductions:deductions,net:net,km:km,diets:diets};
}
function line(label,val){return '<div class="line"><span>'+label+'</span><strong>'+money(val)+'</strong></div>'}
function esc(v){return String(v===undefined||v===null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function input(label,key,obj,value,step){return '<label>'+label+'<input type="number" inputmode="decimal" step="'+(step||"any")+'" min="0" data-target="'+obj+'" data-key="'+key+'" value="'+esc(value)+'"></label>'}
function check(label,key,obj,on){return '<label class="switch"><input type="checkbox" data-target="'+obj+'" data-key="'+key+'" '+(on?"checked":"")+'>'+label+'</label>'}
function sel(label,key,choices,current){return '<label>'+label+'<select data-target="s" data-key="'+key+'">'+choices.map(function(o){return '<option value="'+o[0]+'" '+(o[0]===current?"selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></label>'}
function mainSummary(){
var a=calc(),m=md();
return '<section class="card hero"><div class="sub">NETO ESTIMADO DEL MES</div><div class="amount">'+money(a.net)+'</div><div class="sub">Según tus tarifas y registros; importe orientativo</div></section>'+
'<section class="grid"><div class="metric"><span>Bruto estimado</span><b>'+money(a.gross)+'</b></div><div class="metric"><span>Horas normales</span><b>'+a.normal+' h</b></div><div class="metric"><span>Horas extras</span><b>'+a.extra+' h</b></div><div class="metric"><span>Descanso generado</span><b>'+a.compDays.toFixed(2)+' días</b></div></section>'+
'<section class="card"><h2>Detalle del cálculo</h2>'+line("Salario ordinario",a.base)+line("Horas extras cobradas ("+r(a.paidH)+" h)",a.cashExtra)+line("Prima horas compensadas",a.restCash)+line("Retén",a.onCall)+line("Dietas, kilómetros y pluses",a.supplements)+line("Prima de recarga (neta de compra)",a.premium)+line("Otros devengos",num(m.otherGross))+
'<div class="line"><b>TOTAL BRUTO</b><strong>'+money(a.gross)+'</strong></div>'+line("Seguridad Social (estimada)",-a.ss)+line("IRPF ("+non(d.settings.irpf)+" %)",-a.irpf)+line("Seguro flexible",-a.flexible)+line("Seguro en especie",-a.inkind)+line("Ingreso a cuenta en especie",-a.inkindIRPF)+line("Otras deducciones",-num(m.otherDed))+'<div class="line"><b>NETO APROXIMADO</b><strong style="color:var(--green)">'+money(a.net)+'</strong></div></section>'+
'<section class="card"><h2>Horas y descansos</h2><div class="grid"><div class="metric"><span>Extras cobradas</span><b>'+r(a.paidH)+' h</b></div><div class="metric"><span>Extras compensadas</span><b>'+r(a.compH)+' h</b></div><div class="metric"><span>Días ganados por horas</span><b>'+a.compDays.toFixed(2)+'</b></div><div class="metric"><span>Semana comprada</span><b>'+(m.buyWeek&&m.premium?'5 días':'No')+'</b></div></div>'+(non(m.compDays)>a.possibleDays+.001?'<p class="hint" style="color:#fbbf8b">Has solicitado más días compensados de los generados por las horas registradas.</p>':'')+
'<p class="hint">Si las horas extras se liquidan en otro mes, regístralas en el mes en que te las paguen para aproximar la nómina.</p></section>';
}
function records(){
 var m=md(),parts=month.split("-").map(Number),n=monthDays(),out='<section class="card"><h2>Registro diario</h2><p class="hint">Indica las horas y conceptos realmente realizados. Deja los campos vacíos cuando no correspondan. Los datos se guardan automáticamente.</p>';
 var fields=[["normal","H. normales"],["extra","H. extras"],["km","Km"],["diet","½ dietas"],["pd","Plus diario"],["pf","Plus festivo"]];
 for(var i=1;i<=n;i++){var x=m.days[i]||{},w=new Date(parts[0],parts[1]-1,i).getDay();out+='<div class="dayrow"><div class="dayhead"><span>'+i+' · '+["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][w]+'</span>'+(w===0||w===6?'<span class="sun">Fin de semana</span>':'')+'</div><div class="daygrid">';
 for(var j=0;j<fields.length;j++){var f=fields[j];out+='<label>'+f[1]+'<input type="number" min="0" step="any" inputmode="decimal" data-day="'+i+'" data-key="'+f[0]+'" placeholder="—" value="'+esc(x[f[0]]===undefined?"":x[f[0]])+'"></label>'}out+='</div></div>';}
 return out+'</section><section class="totals"><span>Bruto del mes</span><b id="stickyGross">'+money(calc().gross)+'</b></section>';
}
function settings(){
var s=d.settings,m=md(),out='<section class="card"><h2>Configuración personal</h2><div class="formgrid">'+sel("Modelo de salario","mode",[["daily","Salario + pluses diarios"],["hourly","Horas normales × tarifa"],["fixed","Sueldo mensual fijo"]],s.mode)+input("€/hora normal","normalRate","s",s.normalRate)+input("€/hora extra","extraRate","s",s.extraRate)+input("Salario convenio €/día","dailyBase","s",s.dailyBase)+input("P.T.P. €/día","dailyPTP","s",s.dailyPTP)+input("Nuclear €/día","dailyNuclear","s",s.dailyNuclear)+input("Turnos €/día","dailyTurn","s",s.dailyTurn)+input("Sueldo fijo €/mes","fixedPay","s",s.fixedPay)+check("Incluir P.T.P.","showPTP","s",s.showPTP)+check("Incluir plus nuclear","showNuclear","s",s.showNuclear)+check("Incluir turnos","showTurn","s",s.showTurn)+'</div></section>';
out+='<section class="card"><h2>Horas extras y compensación</h2><div class="formgrid">'+input("Multiplicador de extras cobradas","extraFactor","s",s.extraFactor)+input("Multiplicador de descanso","restFactor","s",s.restFactor)+input("Prima de horas compensadas","restCashFactor","s",s.restCashFactor)+input("Horas de jornada ordinaria","hoursPerDay","s",s.hoursPerDay)+input("Días compensados este mes","compDays","m",m.compDays)+'</div><p class="hint">Ejemplo: 11 horas extras compensadas producen 2,40625 días de descanso y una prima de 5,5 horas a la tarifa extra. Indica arriba cuántos días has decidido compensar.</p></section>';
out+='<section class="card"><h2>Retén y prima de recarga</h2><div class="formgrid">'+check("He tenido retén","onCall","m",m.onCall)+input("Días retén semanal","onNormal","m",m.onNormal)+input("Días retén festivo","onHoliday","m",m.onHoliday)+input("€/día retén normal","onCallNormalRate","s",s.onCallNormalRate)+input("€/día retén festivo","onCallHolidayRate","s",s.onCallHolidayRate)+check("Cobro prima de recarga este mes","premium","m",m.premium)+input("Prima recarga bruta (€)","premiumRate","s",s.premiumRate)+check("Cambio 300 € por 5 días de descanso","buyWeek","m",m.buyWeek)+input("Coste de la semana (€)","weekCost","s",s.weekCost)+'</div></section>';
out+='<section class="card"><h2>Dietas, kilómetros y otros pluses</h2><div class="formgrid">'+input("€/km","kmRate","s",s.kmRate)+input("€/media dieta","dietRate","s",s.dietRate)+input("€/unidad plus diario","dayPlusRate","s",s.dayPlusRate)+input("€/unidad plus festivo","holidayPlusRate","s",s.holidayPlusRate)+input("Otros devengos (€)","otherGross","m",m.otherGross)+input("Otras deducciones (€)","otherDed","m",m.otherDed)+'</div></section>';
out+='<section class="card"><h2>IRPF, cotización y seguro</h2><div class="formgrid">'+input("IRPF (%)","irpf","s",s.irpf)+input("Seguridad Social aproximada (%)","socialRate","s",s.socialRate)+input("Prorrata extras para cotización (€)","extraContribution","s",s.extraContribution)+input("Otros ajustes cotización (€)","collectiveContribution","s",s.collectiveContribution)+check("Tengo seguro médico","health","m",m.health)+input("Seguro flexible (€)","healthFlexible","s",s.healthFlexible)+input("Seguro en especie (€)","healthInKind","s",s.healthInKind)+'</div><p class="hint">Seguro de referencia de nómina: 41,67 € de retribución flexible y 22,17 € en especie, más ingreso a cuenta. El cálculo de Seguridad Social e IRPF es aproximado y depende de los conceptos reales de cada nómina.</p></section>';
out+='<section class="card"><h2>Copia de seguridad</h2><p class="hint">Los datos se almacenan solo en este navegador. Exporta un archivo antes de cambiar de móvil o borrar los datos de Safari/Chrome.</p><div class="tools"><button class="btn" id="export">Exportar datos JSON</button><label class="btn ghost" style="display:inline-block;cursor:pointer">Importar copia<input style="display:none" type="file" id="import" accept="application/json,.json"></label><button class="btn ghost" id="clear">Borrar únicamente este mes</button></div></section>';
return out;
}
function show(){
var parts=month.split("-").map(Number),date=new Date(parts[0],parts[1]-1,1);
document.getElementById("month").textContent=new Intl.DateTimeFormat("es-ES",{month:"long",year:"numeric"}).format(date);
document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.toggle("active",b.dataset.tab===tab)});
document.getElementById("view").innerHTML=tab==="resumen"?mainSummary():tab==="registro"?records():settings();
}
function changeValue(target,key,value,day){
 if(target==="s")d.settings[key]=value;
 if(target==="m")md()[key]=value;
 if(day!==undefined){var a=md().days;if(!a[day])a[day]={};a[day][key]=value;}
 save();
 var bar=document.getElementById("stickyGross");if(bar)bar.textContent=money(calc().gross);
}
document.addEventListener("change",function(e){
var t=e.target;
if(t.id==="import"){var file=t.files[0];if(!file)return;file.text().then(function(txt){var o=JSON.parse(txt);if(!o||!o.months||!o.settings)throw Error("Formato no válido");if(confirm("¿Importar copia y sustituir los datos actuales?")){d=o;d.settings=Object.assign({},S,d.settings||{});d.months=d.months||{};save();show()}}).catch(function(){alert("No se ha podido importar la copia JSON")});return}
if(t.dataset.day){changeValue(null,t.dataset.key,t.value,t.dataset.day);return}
if(t.dataset.target){changeValue(t.dataset.target,t.dataset.key,t.type==="checkbox"?t.checked:t.type==="number"?num(t.value):t.value);if(t.dataset.key==="mode")show()}
});
document.addEventListener("click",function(e){
var t=e.target.closest("button");if(!t)return;
if(t.dataset.tab){tab=t.dataset.tab;show();scrollTo(0,0)}
if(t.id==="prev"||t.id==="next"){var v=month.split("-").map(Number),newD=new Date(v[0],v[1]-1+(t.id==="next"?1:-1),1);month=newD.getFullYear()+"-"+String(newD.getMonth()+1).padStart(2,"0");save();show()}
if(t.id==="export"){var blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="recarga-copia-"+month+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
if(t.id==="clear"&&confirm("¿Borrar todos los registros y ajustes mensuales de "+month+"?")){delete d.months[month];save();show()}
});
show();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(function(){})}
})();
</script>
</body></html>
